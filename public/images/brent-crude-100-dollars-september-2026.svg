<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="420" rx="18" fill="#f4efe3"/>
  <rect x="1" y="1" width="958" height="418" rx="18" fill="none" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="66" font-size="30" font-weight="700" fill="#0b3b2e">Brent crude crosses $100</text>
  <text x="48" y="98" font-size="17" fill="#0b3b2e" fill-opacity="0.55">Hormuz supply shock, and what it costs India</text>
  <text x="912" y="62" font-size="15" font-weight="700" fill="#9b6810" text-anchor="end">ziromarket.com</text>
  <line x1="48" y1="126" x2="912" y2="126" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="176" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">BRENT CRUDE</text>
  <text x="48" y="222" font-size="42" font-weight="800" fill="#c0392b">$100.69</text>
  <text x="48" y="252" font-size="18" font-weight="700" fill="#0b3b2e">highest since July</text>
  <text x="360" y="176" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">INDIA CRUDE BASKET</text>
  <text x="360" y="222" font-size="42" font-weight="800" fill="#c0392b">$108.9</text>
  <text x="360" y="252" font-size="18" font-weight="700" fill="#0b3b2e">four-month high</text>
  <text x="690" y="176" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">IMPORT DEPENDENCE</text>
  <text x="690" y="222" font-size="42" font-weight="800" fill="#0b3b2e">90%+</text>
  <text x="690" y="252" font-size="18" font-weight="700" fill="#0b3b2e">of crude used, FY26</text>
  <line x1="48" y1="288" x2="912" y2="288" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="330" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">FY26 CRUDE IMPORT BILL</text>
  <text x="48" y="366" font-size="26" font-weight="800" fill="#0b3b2e">$134.7 bn</text>
  <text x="360" y="330" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">EACH $10 ON CRUDE</text>
  <text x="360" y="366" font-size="26" font-weight="800" fill="#c0392b">20-30 bps off GDP</text>
  <text x="690" y="330" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">RUPEE</text>
  <text x="690" y="366" font-size="26" font-weight="800" fill="#c0392b">~94.8 / $</text>
</svg>
