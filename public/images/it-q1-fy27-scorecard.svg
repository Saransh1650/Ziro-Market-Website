<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="460" rx="18" fill="#f4efe3"/>
  <rect x="1" y="1" width="958" height="458" rx="18" fill="none" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="60" font-size="30" font-weight="700" fill="#0b3b2e">Q1 FY27 IT scorecard</text>
  <text x="48" y="90" font-size="16" fill="#0b3b2e" fill-opacity="0.55">Net profit (Rs crore) &#183; quarter ended June 2026</text>
  <text x="912" y="56" font-size="15" font-weight="700" fill="#9b6810" text-anchor="end">ziromarket.com</text>
  <line x1="48" y1="112" x2="912" y2="112" stroke="#0b3b2e" stroke-opacity="0.12"/>

  <!-- TCS -->
  <text x="48" y="150" font-size="18" font-weight="700" fill="#0b3b2e">TCS</text>
  <rect x="130" y="136" width="700" height="22" rx="5" fill="#0b3b2e"/>
  <text x="842" y="153" font-size="16" font-weight="700" fill="#0b3b2e">13,349</text>
  <text x="130" y="176" font-size="13" fill="#0b3b2e" fill-opacity="0.6">margin 24% &#183; div Rs 12 &#183; reported 9 Jul</text>

  <!-- Infosys (est) -->
  <text x="48" y="222" font-size="18" font-weight="700" fill="#0b3b2e">Infosys</text>
  <rect x="130" y="208" width="362" height="22" rx="5" fill="#9b6810"/>
  <text x="504" y="225" font-size="16" font-weight="700" fill="#9b6810">~6,900 est</text>
  <text x="130" y="248" font-size="13" fill="#0b3b2e" fill-opacity="0.6">margin 20-22% &#183; due 23 Jul &#183; FY27 guide in focus</text>

  <!-- HCLTech -->
  <text x="48" y="294" font-size="18" font-weight="700" fill="#0b3b2e">HCLTech</text>
  <rect x="130" y="280" width="228" height="22" rx="5" fill="#0b7a3e"/>
  <text x="370" y="297" font-size="16" font-weight="700" fill="#0b7a3e">~4,350</text>
  <text x="130" y="320" font-size="13" fill="#0b3b2e" fill-opacity="0.6">margin 18.2% &#183; div Rs 12 &#183; FY27 guide held 2-4%</text>

  <!-- Wipro -->
  <text x="48" y="366" font-size="18" font-weight="700" fill="#0b3b2e">Wipro</text>
  <rect x="130" y="352" width="177" height="22" rx="5" fill="#0b7a3e"/>
  <text x="319" y="369" font-size="16" font-weight="700" fill="#0b7a3e">~3,380</text>
  <text x="130" y="392" font-size="13" fill="#0b3b2e" fill-opacity="0.6">margin 16.4% &#183; div Re 1 &#183; Q2 guide flat</text>

  <line x1="48" y1="418" x2="912" y2="418" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="444" font-size="15" font-weight="700" fill="#0b3b2e">Verdict: none disappointed, nobody cut guidance. Infosys closes the season 23 July.</text>
</svg>
