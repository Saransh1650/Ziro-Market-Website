<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="420" rx="18" fill="#f4efe3"/>
  <rect x="1" y="1" width="958" height="418" rx="18" fill="none" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="66" font-size="30" font-weight="700" fill="#0b3b2e">Will BRICS launch a currency?</text>
  <text x="48" y="98" font-size="17" fill="#0b3b2e" fill-opacity="0.55">2026 &#183; headline vs reality</text>
  <text x="912" y="62" font-size="15" font-weight="700" fill="#9b6810" text-anchor="end">ziromarket.com</text>
  <line x1="48" y1="126" x2="912" y2="126" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="178" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">THE ANSWER</text>
  <text x="48" y="224" font-size="42" font-weight="800" fill="#c0392b">Very unlikely</text>
  <text x="48" y="258" font-size="20" font-weight="700" fill="#0b3b2e">no shared central bank or trust</text>
  <text x="540" y="178" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">INDIA'S STANCE</text>
  <text x="540" y="222" font-size="22" font-weight="700" fill="#0b3b2e">won't cede control</text>
  <text x="540" y="250" font-size="22" font-weight="700" fill="#0b3b2e">of the rupee</text>
  <line x1="48" y1="292" x2="912" y2="292" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="330" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">WHAT'S ACTUALLY HAPPENING</text>
  <text x="48" y="364" font-size="21" font-weight="700" fill="#0b7a3e">local-currency trade &#183; gold &#183; CIPS / BRICS Pay</text>
  <text x="48" y="396" font-size="15" font-weight="700" fill="#9b6810">The headline is a revolution; the reality is a slow drift.</text>
</svg>
