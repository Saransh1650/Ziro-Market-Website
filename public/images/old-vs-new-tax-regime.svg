<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="420" rx="18" fill="#f4efe3"/>
  <rect x="1" y="1" width="958" height="418" rx="18" fill="none" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="62" font-size="29" font-weight="700" fill="#0b3b2e">Old vs new tax regime, FY 2026-27</text>
  <text x="48" y="92" font-size="16" fill="#0b3b2e" fill-opacity="0.55">Marginal rate by income band. Budget 2026 changed neither.</text>
  <text x="912" y="58" font-size="15" font-weight="700" fill="#9b6810" text-anchor="end">ziromarket.com</text>
  <line x1="48" y1="112" x2="912" y2="112" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="140" font-size="14" font-weight="700" fill="#0b3b2e" fill-opacity="0.6" letter-spacing="1.2">NEW REGIME (DEFAULT)</text>
  <rect x="48" y="152" width="78" height="34" fill="#1e7a4f" fill-opacity="0.18"/><text x="87" y="175" font-size="15" font-weight="700" fill="#0b3b2e" text-anchor="middle">0%</text>
  <rect x="130" y="152" width="78" height="34" fill="#1e7a4f" fill-opacity="0.3"/><text x="169" y="175" font-size="15" font-weight="700" fill="#0b3b2e" text-anchor="middle">5%</text>
  <rect x="212" y="152" width="78" height="34" fill="#1e7a4f" fill-opacity="0.42"/><text x="251" y="175" font-size="15" font-weight="700" fill="#0b3b2e" text-anchor="middle">10%</text>
  <rect x="294" y="152" width="78" height="34" fill="#1e7a4f" fill-opacity="0.54"/><text x="333" y="175" font-size="15" font-weight="700" fill="#0b3b2e" text-anchor="middle">15%</text>
  <rect x="376" y="152" width="78" height="34" fill="#1e7a4f" fill-opacity="0.66"/><text x="415" y="175" font-size="15" font-weight="700" fill="#0b3b2e" text-anchor="middle">20%</text>
  <rect x="458" y="152" width="78" height="34" fill="#1e7a4f" fill-opacity="0.78"/><text x="497" y="175" font-size="15" font-weight="700" fill="#0b3b2e" text-anchor="middle">25%</text>
  <rect x="540" y="152" width="120" height="34" fill="#1e7a4f" fill-opacity="0.92"/><text x="600" y="175" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">30%</text>
  <text x="48" y="208" font-size="14" fill="#0b3b2e" fill-opacity="0.6">0-4L &#183; 4-8L &#183; 8-12L &#183; 12-16L &#183; 16-20L &#183; 20-24L &#183; 24L+</text>
  <text x="48" y="248" font-size="14" font-weight="700" fill="#0b3b2e" fill-opacity="0.6" letter-spacing="1.2">OLD REGIME</text>
  <rect x="48" y="260" width="78" height="34" fill="#9b6810" fill-opacity="0.18"/><text x="87" y="283" font-size="15" font-weight="700" fill="#0b3b2e" text-anchor="middle">0%</text>
  <rect x="130" y="260" width="78" height="34" fill="#9b6810" fill-opacity="0.34"/><text x="169" y="283" font-size="15" font-weight="700" fill="#0b3b2e" text-anchor="middle">5%</text>
  <rect x="212" y="260" width="160" height="34" fill="#9b6810" fill-opacity="0.62"/><text x="292" y="283" font-size="15" font-weight="700" fill="#0b3b2e" text-anchor="middle">20%</text>
  <rect x="376" y="260" width="284" height="34" fill="#9b6810" fill-opacity="0.92"/><text x="518" y="283" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">30%</text>
  <text x="48" y="316" font-size="14" fill="#0b3b2e" fill-opacity="0.6">0-2.5L &#183; 2.5-5L &#183; 5-10L &#183; above 10L</text>
  <line x1="48" y1="340" x2="912" y2="340" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="372" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">THE DECIDING NUMBER</text>
  <text x="48" y="398" font-size="21" font-weight="700" fill="#0b3b2e">Your total deductions. Below roughly Rs 8 lakh of them, the new regime wins.</text>
