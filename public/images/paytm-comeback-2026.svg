<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="420" rx="18" fill="#f4efe3"/>
  <rect x="1" y="1" width="958" height="418" rx="18" fill="none" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="66" font-size="30" font-weight="700" fill="#0b3b2e">Paytm 2026: is the comeback real?</text>
  <text x="48" y="98" font-size="17" fill="#0b3b2e" fill-opacity="0.55">From the 2024 bank shutdown to profit</text>
  <text x="912" y="62" font-size="15" font-weight="700" fill="#9b6810" text-anchor="end">ziromarket.com</text>
  <line x1="48" y1="126" x2="912" y2="126" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="178" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">STOCK</text>
  <text x="48" y="224" font-size="38" font-weight="800" fill="#0b7a3e">~Rs 310 &#8594; ~1,050</text>
  <text x="48" y="258" font-size="20" font-weight="700" fill="#c0392b">still below Rs 2,150 IPO</text>
  <text x="560" y="178" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">PROFIT</text>
  <text x="560" y="224" font-size="38" font-weight="800" fill="#0b7a3e">positive</text>
  <text x="560" y="258" font-size="20" font-weight="700" fill="#0b3b2e">adjusted EBITDA</text>
  <line x1="48" y1="292" x2="912" y2="292" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="330" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">HOW IT SURVIVED</text>
  <text x="48" y="366" font-size="22" font-weight="700" fill="#0b3b2e">cost cuts &#183; loan distribution &#183; soundbox lead</text>
  <text x="48" y="396" font-size="15" font-weight="700" fill="#9b6810">The regulatory shadow has not fully lifted</text>
</svg>
