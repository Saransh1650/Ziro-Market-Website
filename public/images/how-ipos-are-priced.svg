<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="420" rx="18" fill="#f4efe3"/>
  <rect x="1" y="1" width="958" height="418" rx="18" fill="none" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="62" font-size="29" font-weight="700" fill="#0b3b2e">How an IPO price band gets set</text>
  <text x="48" y="92" font-size="16" fill="#0b3b2e" fill-opacity="0.55">The sequence, with the NSE issue of September 2026 as the example</text>
  <text x="912" y="58" font-size="15" font-weight="700" fill="#9b6810" text-anchor="end">ziromarket.com</text>
  <line x1="48" y1="112" x2="912" y2="112" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <rect x="48" y="140" width="196" height="94" rx="8" fill="#0b3b2e" fill-opacity="0.08"/>
  <text x="68" y="168" font-size="14" font-weight="700" fill="#9b6810">STEP 1</text>
  <text x="68" y="192" font-size="17" font-weight="700" fill="#0b3b2e">Pre-marketing</text>
  <text x="68" y="214" font-size="14" fill="#0b3b2e" fill-opacity="0.7">Bankers sound out</text>
  <text x="68" y="230" font-size="14" fill="#0b3b2e" fill-opacity="0.7">institutions privately</text>
  <rect x="268" y="140" width="196" height="94" rx="8" fill="#0b3b2e" fill-opacity="0.08"/>
  <text x="288" y="168" font-size="14" font-weight="700" fill="#9b6810">STEP 2</text>
  <text x="288" y="192" font-size="17" font-weight="700" fill="#0b3b2e">Band fixed</text>
  <text x="288" y="214" font-size="14" fill="#0b3b2e" fill-opacity="0.7">Rs 1,700 to Rs 1,785</text>
  <text x="288" y="230" font-size="14" fill="#0b3b2e" fill-opacity="0.7">cap under 120% of floor</text>
  <rect x="488" y="140" width="196" height="94" rx="8" fill="#0b3b2e" fill-opacity="0.08"/>
  <text x="508" y="168" font-size="14" font-weight="700" fill="#9b6810">STEP 3</text>
  <text x="508" y="192" font-size="17" font-weight="700" fill="#0b3b2e">Anchor book</text>
  <text x="508" y="214" font-size="14" fill="#0b3b2e" fill-opacity="0.7">Rs 6,250 crore, one</text>
  <text x="508" y="230" font-size="14" fill="#0b3b2e" fill-opacity="0.7">day before opening</text>
  <rect x="708" y="140" width="204" height="94" rx="8" fill="#1e7a4f" fill-opacity="0.16"/>
  <text x="728" y="168" font-size="14" font-weight="700" fill="#9b6810">STEP 4</text>
  <text x="728" y="192" font-size="17" font-weight="700" fill="#0b3b2e">You bid</text>
  <text x="728" y="214" font-size="14" fill="#0b3b2e" fill-opacity="0.7">Usually at cut-off,</text>
  <text x="728" y="230" font-size="14" fill="#0b3b2e" fill-opacity="0.7">price already fixed</text>
  <line x1="48" y1="266" x2="912" y2="266" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="298" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">WHO GETS WHAT, BY REGULATION</text>
  <rect x="48" y="314" width="432" height="38" fill="#0b3b2e" fill-opacity="0.55"/><text x="264" y="339" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">QIB, not more than 50%</text>
  <rect x="484" y="314" width="302" height="38" fill="#1e7a4f" fill-opacity="0.45"/><text x="635" y="339" font-size="16" font-weight="700" fill="#0b3b2e" text-anchor="middle">Retail, not less than 35%</text>
  <rect x="790" y="314" width="122" height="38" fill="#9b6810" fill-opacity="0.35"/><text x="851" y="339" font-size="15" font-weight="700" fill="#0b3b2e" text-anchor="middle">NII 15%</text>
  <text x="48" y="392" font-size="19" font-weight="700" fill="#0b3b2e">A retail investor competes only with retail. Watch that line, not the overall number.</text>
</svg>
