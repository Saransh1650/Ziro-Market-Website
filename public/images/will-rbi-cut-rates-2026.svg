<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="420" rx="18" fill="#f4efe3"/>
  <rect x="1" y="1" width="958" height="418" rx="18" fill="none" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="66" font-size="30" font-weight="700" fill="#0b3b2e">Will the RBI cut rates again in 2026?</text>
  <text x="48" y="98" font-size="17" fill="#0b3b2e" fill-opacity="0.55">Repo at 5.25% after a June cut and August hold</text>
  <text x="912" y="62" font-size="15" font-weight="700" fill="#9b6810" text-anchor="end">ziromarket.com</text>
  <line x1="48" y1="126" x2="912" y2="126" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="178" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">REPO RATE</text>
  <text x="48" y="224" font-size="42" font-weight="800" fill="#0b3b2e">5.25%</text>
  <text x="48" y="258" font-size="20" font-weight="700" fill="#9b6810">neutral stance</text>
  <text x="470" y="178" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">LIKELY NEXT MOVE</text>
  <text x="470" y="224" font-size="42" font-weight="800" fill="#0b7a3e">a cut</text>
  <text x="470" y="258" font-size="20" font-weight="700" fill="#0b3b2e">if the data cooperates</text>
  <line x1="48" y1="292" x2="912" y2="292" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="330" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">POINTS TO A CUT</text>
  <text x="48" y="362" font-size="19" font-weight="700" fill="#0b7a3e">inflation to 4% &#183; dovish Fed &#183; slow growth</text>
  <text x="48" y="394" font-size="15" font-weight="700" fill="#c0392b">BLOCKS IT: oil spike &#183; weak rupee &#183; sticky food prices</text>
