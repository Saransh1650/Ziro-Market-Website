<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="420" rx="18" fill="#f4efe3"/>
  <rect x="1" y="1" width="958" height="418" rx="18" fill="none" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="66" font-size="30" font-weight="700" fill="#0b3b2e">The 30-day tariff clock on India</text>
  <text x="48" y="98" font-size="17" fill="#0b3b2e" fill-opacity="0.55">Sanctioning Russia and Iran Act, signed 18 September 2026</text>
  <text x="912" y="62" font-size="15" font-weight="700" fill="#9b6810" text-anchor="end">ziromarket.com</text>
  <line x1="48" y1="126" x2="912" y2="126" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="176" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">TARIFF CEILING</text>
  <text x="48" y="222" font-size="44" font-weight="800" fill="#c0392b">100%</text>
  <text x="48" y="252" font-size="17" font-weight="700" fill="#0b3b2e">rate set at discretion</text>
  <text x="340" y="176" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">CURRENT US RATE</text>
  <text x="340" y="222" font-size="44" font-weight="800" fill="#0b3b2e">18%</text>
  <text x="340" y="252" font-size="17" font-weight="700" fill="#0b3b2e">cut from 50% in Feb 2026</text>
  <text x="680" y="176" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">DECISION BY</text>
  <text x="680" y="222" font-size="44" font-weight="800" fill="#9b6810">18 Oct</text>
  <text x="680" y="252" font-size="17" font-weight="700" fill="#0b3b2e">30 days from enactment</text>
  <line x1="48" y1="288" x2="912" y2="288" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="326" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">WHY INDIA IS ON THE LIST</text>
  <text x="48" y="362" font-size="24" font-weight="700" fill="#0b3b2e">2.08 mn barrels a day of Russian crude in August, about 45% of imports</text>
  <text x="48" y="392" font-size="17" font-weight="700" fill="#0b3b2e" fill-opacity="0.65">Top five buyers: China, India, Slovakia, Hungary, Azerbaijan. List reviewed every 180 days.</text>
</svg>
