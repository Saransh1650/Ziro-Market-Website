<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="420" rx="18" fill="#f4efe3"/>
  <rect x="1" y="1" width="958" height="418" rx="18" fill="none" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="66" font-size="30" font-weight="700" fill="#0b3b2e">Strait of Hormuz &amp; India</text>
  <text x="48" y="98" font-size="17" fill="#0b3b2e" fill-opacity="0.55">The world's oil chokepoint</text>
  <text x="912" y="62" font-size="15" font-weight="700" fill="#9b6810" text-anchor="end">ziromarket.com</text>
  <line x1="48" y1="126" x2="912" y2="126" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="178" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">CARRIES</text>
  <text x="48" y="224" font-size="46" font-weight="800" fill="#0b3b2e">~1/5</text>
  <text x="48" y="258" font-size="20" font-weight="700" fill="#0b3b2e">of the world's oil</text>
  <text x="430" y="178" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">EVERY DAY</text>
  <text x="430" y="224" font-size="46" font-weight="800" fill="#0b3b2e">~20 mn</text>
  <text x="430" y="258" font-size="20" font-weight="700" fill="#0b3b2e">barrels via tankers</text>
  <line x1="48" y1="292" x2="912" y2="292" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="338" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">IF CLOSED</text>
  <text x="48" y="372" font-size="24" font-weight="700" fill="#c0392b">Oil could top $100</text>
  <text x="480" y="338" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">INDIA RISK</text>
  <text x="480" y="372" font-size="24" font-weight="700" fill="#c0392b">Rupee, inflation hit</text>
</svg>
