<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="460" rx="18" fill="#f4efe3"/>
  <rect x="1" y="1" width="958" height="458" rx="18" fill="none" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="60" font-size="30" font-weight="700" fill="#0b3b2e">Choosing a mutual fund: 5 steps</text>
  <text x="48" y="90" font-size="16" fill="#0b3b2e" fill-opacity="0.55">India &#183; a simple checklist</text>
  <text x="912" y="56" font-size="15" font-weight="700" fill="#9b6810" text-anchor="end">ziromarket.com</text>
  <line x1="48" y1="112" x2="912" y2="112" stroke="#0b3b2e" stroke-opacity="0.12"/>

  <text x="60" y="164" font-size="20" font-weight="800" fill="#9b6810">1</text>
  <text x="96" y="164" font-size="19" font-weight="700" fill="#0b3b2e">Match it to your goal and time horizon</text>

  <text x="60" y="216" font-size="20" font-weight="800" fill="#9b6810">2</text>
  <text x="96" y="216" font-size="19" font-weight="700" fill="#0b3b2e">Prefer low-cost index funds by default</text>

  <text x="60" y="268" font-size="20" font-weight="800" fill="#9b6810">3</text>
  <text x="96" y="268" font-size="19" font-weight="700" fill="#0b3b2e">Pick the direct plan, check the expense ratio</text>

  <text x="60" y="320" font-size="20" font-weight="800" fill="#9b6810">4</text>
  <text x="96" y="320" font-size="19" font-weight="700" fill="#0b3b2e">Judge a long track record, not last year</text>

  <text x="60" y="372" font-size="20" font-weight="800" fill="#9b6810">5</text>
  <text x="96" y="372" font-size="19" font-weight="700" fill="#0b3b2e">Check the risk and the fund house</text>

  <line x1="48" y1="404" x2="912" y2="404" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="432" font-size="15" font-weight="700" fill="#c0392b">Avoid: chasing last year's winner, regular plans, and too many overlapping funds.</text>
</svg>
