  <text x="519" y="225" font-size="16" font-weight="700" fill="#0b7a3e">~7,000</text>
  <text x="150" y="248" font-size="13" fill="#0b3b2e" fill-opacity="0.6">मार्जिन 21.2% &#183; 23 जुलाई &#183; FY27 अनुमान बढ़ाकर 2-4%</text>

  <text x="48" y="294" font-size="18" font-weight="700" fill="#0b3b2e">एचसीएल टेक</text>
  <rect x="150" y="280" width="222" height="22" rx="5" fill="#0b7a3e"/>
  <text x="384" y="297" font-size="16" font-weight="700" fill="#0b7a3e">~4,350</text>
  <text x="150" y="320" font-size="13" fill="#0b3b2e" fill-opacity="0.6">मार्जिन 18.2% &#183; डिविडेंड Rs 12 &#183; FY27 अनुमान बरक़रार</text>

  <text x="48" y="366" font-size="18" font-weight="700" fill="#0b3b2e">विप्रो</text>
  <rect x="150" y="352" width="172" height="22" rx="5" fill="#0b7a3e"/>
  <text x="334" y="369" font-size="16" font-weight="700" fill="#0b7a3e">~3,380</text>
  <text x="150" y="392" font-size="13" fill="#0b3b2e" fill-opacity="0.6">मार्जिन 16.4% &#183; डिविडेंड Re 1 &#183; अगली तिमाही सपाट</text>

  <line x1="48" y1="418" x2="912" y2="418" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="444" font-size="15" font-weight="700" fill="#0b3b2e">नतीजा: चारों स्थिर, किसी ने अनुमान नहीं घटाया, इंफ़ोसिस ने बढ़ाया। रिकवरी के संकेत।</text>
