<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Noto Sans Devanagari', Arial, Helvetica, sans-serif">
  <rect width="960" height="460" rx="18" fill="#f4efe3"/>
  <rect x="1" y="1" width="958" height="458" rx="18" fill="none" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="60" font-size="30" font-weight="700" fill="#0b3b2e">Q1 FY27 आईटी स्कोरकार्ड</text>
  <text x="48" y="90" font-size="16" fill="#0b3b2e" fill-opacity="0.55">शुद्ध मुनाफ़ा (करोड़ रु) &#183; जून 2026 तिमाही</text>
  <text x="912" y="56" font-size="15" font-weight="700" fill="#9b6810" text-anchor="end">ziromarket.com</text>
  <line x1="48" y1="112" x2="912" y2="112" stroke="#0b3b2e" stroke-opacity="0.12"/>

  <text x="48" y="150" font-size="18" font-weight="700" fill="#0b3b2e">टीसीएस</text>
  <rect x="150" y="136" width="680" height="22" rx="5" fill="#0b3b2e"/>
  <text x="842" y="153" font-size="16" font-weight="700" fill="#0b3b2e">13,349</text>
  <text x="150" y="176" font-size="13" fill="#0b3b2e" fill-opacity="0.6">मार्जिन 24% &#183; डिविडेंड Rs 12 &#183; 9 जुलाई</text>

  <text x="48" y="222" font-size="18" font-weight="700" fill="#0b3b2e">इंफ़ोसिस</text>
