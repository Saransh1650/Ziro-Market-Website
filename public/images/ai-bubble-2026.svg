<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="420" rx="18" fill="#f4efe3"/>
  <rect x="1" y="1" width="958" height="418" rx="18" fill="none" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="66" font-size="30" font-weight="700" fill="#0b3b2e">Is there an AI bubble in 2026?</text>
  <text x="48" y="98" font-size="17" fill="#0b3b2e" fill-opacity="0.55">Real warning signs, real profits, no easy answer</text>
  <text x="912" y="62" font-size="15" font-weight="700" fill="#9b6810" text-anchor="end">ziromarket.com</text>
  <line x1="48" y1="126" x2="912" y2="126" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="178" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">BUBBLE SIGNS</text>
  <text x="48" y="214" font-size="20" font-weight="700" fill="#c0392b">$690bn capex &gt; revenue</text>
  <text x="48" y="244" font-size="20" font-weight="700" fill="#c0392b">few names, high valuations</text>
  <text x="510" y="178" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">NOT 2000, BECAUSE</text>
  <text x="510" y="214" font-size="20" font-weight="700" fill="#0b7a3e">real profits (Nvidia $81bn)</text>
  <text x="510" y="244" font-size="20" font-weight="700" fill="#0b7a3e">cash-funded, not debt</text>
  <line x1="48" y1="292" x2="912" y2="292" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="330" font-size="15" fill="#0b3b2e" fill-opacity="0.55" letter-spacing="1.5">WHAT POPS IT</text>
  <text x="48" y="366" font-size="22" font-weight="700" fill="#0b3b2e">AI revenue failing to justify the spend</text>
  <text x="48" y="396" font-size="15" font-weight="700" fill="#9b6810">A real technology can still have a brutal correction</text>
</svg>
