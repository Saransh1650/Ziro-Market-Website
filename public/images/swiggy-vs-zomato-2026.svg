<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="440" rx="18" fill="#f4efe3"/>
  <rect x="1" y="1" width="958" height="438" rx="18" fill="none" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="60" font-size="30" font-weight="700" fill="#0b3b2e">Swiggy vs Zomato 2026</text>
  <text x="48" y="90" font-size="16" fill="#0b3b2e" fill-opacity="0.55">Zomato's parent is now Eternal &#183; who's winning?</text>
  <text x="912" y="56" font-size="15" font-weight="700" fill="#9b6810" text-anchor="end">ziromarket.com</text>
  <line x1="48" y1="112" x2="912" y2="112" stroke="#0b3b2e" stroke-opacity="0.12"/>

  <text x="270" y="150" font-size="20" font-weight="700" fill="#0b7a3e" text-anchor="middle">ETERNAL (Zomato)</text>
  <text x="690" y="150" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle">SWIGGY</text>

  <text x="48" y="196" font-size="15" fill="#0b3b2e" fill-opacity="0.6">Food delivery</text>
  <text x="270" y="196" font-size="17" font-weight="700" fill="#0b3b2e" text-anchor="middle">co-leader</text>
  <text x="690" y="196" font-size="17" font-weight="700" fill="#0b3b2e" text-anchor="middle">close No. 2</text>

  <text x="48" y="240" font-size="15" fill="#0b3b2e" fill-opacity="0.6">Quick commerce</text>
  <text x="270" y="240" font-size="17" font-weight="700" fill="#0b7a3e" text-anchor="middle">Blinkit, leads, profit</text>
  <text x="690" y="240" font-size="17" font-weight="700" fill="#c0392b" text-anchor="middle">Instamart, behind</text>

  <text x="48" y="284" font-size="15" fill="#0b3b2e" fill-opacity="0.6">Profitability</text>
  <text x="270" y="284" font-size="17" font-weight="700" fill="#0b7a3e" text-anchor="middle">profitable</text>
  <text x="690" y="284" font-size="17" font-weight="700" fill="#c0392b" text-anchor="middle">loss-making</text>

  <text x="48" y="328" font-size="15" fill="#0b3b2e" fill-opacity="0.6">Market value</text>
  <text x="270" y="328" font-size="17" font-weight="700" fill="#0b3b2e" text-anchor="middle">larger</text>
  <text x="690" y="328" font-size="17" font-weight="700" fill="#0b3b2e" text-anchor="middle">cheaper, riskier</text>

  <line x1="48" y1="360" x2="912" y2="360" stroke="#0b3b2e" stroke-opacity="0.12"/>
  <text x="48" y="392" font-size="16" font-weight="700" fill="#0b3b2e">Quick commerce is the real battleground, and Eternal leads it.</text>
  <text x="48" y="418" font-size="13" fill="#0b3b2e" fill-opacity="0.55">Not investment advice. Both are widely held, volatile new-age stocks.</text>
</svg>
